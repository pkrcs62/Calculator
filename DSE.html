<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSE Payout Request Form</title>
<style>
:root{--blue:#0b4a8f;--ink:#12233f;--bg:#e8eef6;--err:#c0262d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--blue)}
.bar button{flex:1 1 auto;font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 12px;background:#fff;color:var(--blue);cursor:pointer}
.bar .wa{background:#25d366;color:#053b1b}
.bar .gh{background:transparent;color:#fff;border:1px solid #fff}
button:focus-visible,input:focus-visible{outline:3px solid #f5b301;outline-offset:1px}
.wrap{max-width:820px;margin:0 auto;padding:10px}
fieldset{border:1px solid #b8c7dc;border-radius:8px;background:#fff;margin:0 0 10px;padding:8px 10px 12px}
legend{font-weight:700;color:var(--blue);padding:0 6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.f{display:flex;flex-direction:column;font-size:12px;font-weight:600}
.f.w{grid-column:1/-1}
input[type=text],input[type=tel],input[type=number],input[type=date]{font:inherit;font-weight:400;padding:8px;border:1px solid #9fb1c9;border-radius:6px;width:100%;background:#fff;color:var(--ink)}
select{font:inherit;font-weight:400;padding:8px;border:1px solid #9fb1c9;border-radius:6px;width:100%;background:#fff;color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 12px;background:var(--blue);color:#fff;cursor:pointer}
.btn.d{background:#fff;color:var(--err);border:1px solid var(--err)}
.ok{color:#14703a!important}
input.bad{border-color:var(--err);background:#fff4f4}
.e{color:var(--err);font-weight:400;min-height:14px;font-size:11px}
.ck{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.ck label{display:flex;gap:6px;align-items:center}
.calc{font-size:13px;margin-top:8px;padding:8px;background:#eef4fc;border-radius:6px}
canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 1px 6px #0003;margin-top:6px}
#pa{display:none}
@media (max-width:560px){.g{grid-template-columns:1fr}}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}
 .bar,.wrap{display:none!important}
 #pa{display:block}
 #pa img{display:block;width:210mm;height:297mm}
}
</style></head><body>
<div class="bar">
 <button class="wa" id="wa" type="button">Share on WhatsApp</button>
 <button id="pr" type="button">Print</button>
 <button id="dl" type="button">Download PDF</button>
 <button class="gh" id="cl" type="button">Clear</button>
</div>
<div class="wrap">
<fieldset><legend>Form</legend><div class="g">
 <label class="f w"><span>Date</span><input type="date" id="date"></label></div></fieldset>
<fieldset><legend>A. DSE details</legend><div class="g">
 <label class="f w">Select DSE<select id="ds"></select></label>
 <div class="f w" style="flex-direction:row;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn" id="dadd">+ Add new DSE</button><button type="button" class="btn d" id="ddel" style="display:none">Delete this DSE</button><span class="e" id="dsmsg"></span></div>
 <div class="f w" id="dpanel" style="display:none;border:1px solid #9fb1c9;border-radius:8px;padding:10px;background:#f4f8fd"><div class="g">
  <label class="f w">DSE Name<input type="text" id="nn"></label>
  <label class="f">Company<select id="nmk"></select></label>
  <label class="f">Vendor ID<input type="text" id="nv"></label>
  <label class="f">Mobile No.<input type="tel" id="nm" inputmode="numeric" maxlength="10"></label>
  <label class="f">PAN Number<input type="text" id="np" maxlength="10" autocapitalize="characters"></label>
  <label class="f">A/C No.<input type="tel" id="na" inputmode="numeric" maxlength="18"></label>
  <label class="f">IFSC<input type="text" id="ni" maxlength="11" autocapitalize="characters"><span class="e" id="nife"></span></label>
  <label class="f">Bank Name<input type="text" id="nb" placeholder="Auto from IFSC"></label>
  <label class="f">Branch<input type="text" id="nbr" placeholder="Auto from IFSC"></label></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn" id="dok">Add DSE</button><button type="button" class="btn d" id="dcancel">Cancel</button></div><span class="e" id="dpe"></span></div>
 <label class="f w">Vendor ID<input type="text" id="vid"></label>
 <label class="f">Vehicle Make<select id="mk"></select></label>
 <label class="f">Vehicle Model<select id="vsel"></select><input type="text" id="veh" autocomplete="off" placeholder="Type model" style="display:none;margin-top:6px"></label>
 <label class="f">DSE Name<input type="text" id="dse"></label>
 <label class="f">Dealer Name<input type="text" id="dealer"></label>
 <label class="f">Mobile No.<input type="tel" id="mob" inputmode="numeric" maxlength="10"></label>
 <label class="f">PAN Number<input type="text" id="pan" maxlength="10" autocapitalize="characters"><span class="e" id="pane"></span></label>
 <label class="f">A/C No. (9 to 18 digits)<input type="tel" id="acno" inputmode="numeric" maxlength="18"><span class="e" id="acne"></span></label>
 <label class="f">IFSC<input type="text" id="ifsc" maxlength="11" autocapitalize="characters"><span class="e" id="ife"></span></label>
 <label class="f">Bank Name<input type="text" id="bank"></label>
 <label class="f">Branch<input type="text" id="br"></label>
</div></fieldset>
<fieldset><legend>B. Car loan details</legend><div class="g">
 <label class="f">Customer Name<input type="text" id="cust"></label>
 <label class="f">Loan A/C No. (11 digits)<input type="tel" id="lac" inputmode="numeric" maxlength="11"><span class="e" id="lace"></span></label>
 <label class="f">LOS ID / RLMS ID<input type="text" id="los" inputmode="numeric"></label>
 <label class="f">Loan Amount (₹)<input type="number" id="amt" min="0" step="any" inputmode="decimal"></label>
 <label class="f">Date of Disbursement<input type="date" id="ddate"></label>
</div></fieldset>
<fieldset><legend>C. Payout</legend>
 <div class="ck"><label><input type="checkbox" id="pre"> Pre-fill branch recommended amount</label>
 <label><input type="checkbox" id="tick" checked> Tick Yes: Verified and Payout Eligible</label></div>
 <div class="calc" id="calc"></div></fieldset>
<canvas id="cv" width="1654" height="2339"></canvas>
</div>
<div id="pa"><img id="pi" alt=""></div>
